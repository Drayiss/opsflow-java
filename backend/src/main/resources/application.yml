server:
  port: 8080
  error:
    include-message: never
spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5434/opsflow}
    username: ${DATABASE_USER:opsflow}
    password: ${DATABASE_PASSWORD:local-only-password}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:20}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:false}
      timeout: 500ms
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER:http://localhost:8180/realms/opsflow}
          jwk-set-uri: ${OIDC_JWKS:http://localhost:8180/realms/opsflow/protocol/openid-connect/certs}
          audiences: ${OIDC_AUDIENCE:opsflow-api}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db
opsflow:
  cors-origin: ${CORS_ORIGIN:http://localhost:5174}
  cache-enabled: ${CACHE_ENABLED:true}
  notifications:
    transport: ${NOTIFICATION_TRANSPORT:local}
    namespace: ${SERVICEBUS_NAMESPACE:}
    connection-string: ${SERVICEBUS_CONNECTION_STRING:}
    queue: ${SERVICEBUS_QUEUE:incident-events}
    dispatch-enabled: ${DISPATCH_ENABLED:true}
