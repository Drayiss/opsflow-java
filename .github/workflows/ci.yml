name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "25", cache: maven }
      - uses: actions/setup-node@v7
        with:
          {
            node-version: "24",
            cache: npm,
            cache-dependency-path: frontend/package-lock.json,
          }
      - run: mvn -B -f backend/pom.xml verify
      - run: npm ci && npm run build
        working-directory: frontend
      - run: docker compose up -d --build
      - run: pwsh scripts/seed-demo.ps1
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - uses: actions/upload-artifact@v7
        if: failure()
        with: { name: browser-test-results, path: frontend/test-results }
      - run: docker compose logs && docker compose down
        if: always()
