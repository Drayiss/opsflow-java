name: Deploy Azure
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  id-token: write
concurrency:
  group: azure-production
  cancel-in-progress: false
jobs:
  verify:
    if: vars.AZURE_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "25", cache: maven }
      - uses: actions/setup-node@v4
        with:
          {
            node-version: "24",
            cache: npm,
            cache-dependency-path: frontend/package-lock.json,
          }
      - run: mvn -B -f backend/pom.xml verify
      - run: npm ci && npm run build
        working-directory: frontend
      - run: docker compose up -d --build
      - run: pwsh scripts/seed-demo.ps1
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: docker compose logs && docker compose down
        if: always()
  deploy:
    needs: verify
    if: vars.AZURE_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Check deployment configuration
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_APP_NAME: ${{ vars.AZURE_APP_NAME }}
          ACR_NAME: ${{ vars.ACR_NAME }}
          OIDC_ISSUER: ${{ vars.OIDC_ISSUER }}
          OIDC_CLIENT_ID: ${{ vars.OIDC_CLIENT_ID }}
          OIDC_SCOPE: ${{ vars.OIDC_SCOPE }}
          OIDC_AUTHORIZATION_AUDIENCE: ${{ vars.OIDC_AUTHORIZATION_AUDIENCE }}
        run: |
          $required = @('AZURE_CLIENT_ID', 'AZURE_TENANT_ID', 'AZURE_SUBSCRIPTION_ID', 'AZURE_RESOURCE_GROUP', 'AZURE_APP_NAME', 'ACR_NAME', 'OIDC_ISSUER', 'OIDC_CLIENT_ID', 'OIDC_SCOPE')
          if ($env:OIDC_ISSUER -match '\.auth0\.com/') { $required += 'OIDC_AUTHORIZATION_AUDIENCE' }
          $missing = @($required | Where-Object { [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) })
          if ($missing.Count) { throw "Missing GitHub production environment variables: $($missing -join ', '). Add them under Settings > Environments > production before rerunning this workflow." }
          Write-Output 'Deployment configuration is complete.'
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: docker/setup-buildx-action@v3
      - run: az acr login --name "$ACR_NAME"
        env: { ACR_NAME: "${{ vars.ACR_NAME }}" }
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ vars.ACR_NAME }}.azurecr.io/opsflow-api:${{ github.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: ${{ vars.ACR_NAME }}.azurecr.io/opsflow-web:${{ github.sha }}
          build-args: |
            VITE_OIDC_AUTHORITY=${{ vars.OIDC_ISSUER }}
            VITE_OIDC_CLIENT_ID=${{ vars.OIDC_CLIENT_ID }}
            VITE_OIDC_SCOPE=${{ vars.OIDC_SCOPE }}
            VITE_OIDC_AUTHORIZATION_AUDIENCE=${{ vars.OIDC_AUTHORIZATION_AUDIENCE }}
            VITE_API_URL=/api
      - name: Update both images in one revision
        shell: pwsh
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          APP_NAME: ${{ vars.AZURE_APP_NAME }}
          REGISTRY: ${{ vars.ACR_NAME }}.azurecr.io
          IMAGE_TAG: ${{ github.sha }}
        run: |
          $app = az containerapp show -g $env:RESOURCE_GROUP -n $env:APP_NAME -o json | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read app' }
          $app.properties.template.containers | ForEach-Object { $_.image = "$($env:REGISTRY)/opsflow-$($_.name):$($env:IMAGE_TAG)" }
          $app | ConvertTo-Json -Depth 100 | Set-Content app.json
          az containerapp update -g $env:RESOURCE_GROUP -n $env:APP_NAME --yaml app.json -o none
          if ($LASTEXITCODE -ne 0) { throw 'Deployment failed' }
      - name: Verify public health endpoint
        shell: bash
        env:
          {
            RESOURCE_GROUP: "${{ vars.AZURE_RESOURCE_GROUP }}",
            APP_NAME: "${{ vars.AZURE_APP_NAME }}",
          }
        run: |
          host=$(az containerapp show -g "$RESOURCE_GROUP" -n "$APP_NAME" --query properties.configuration.ingress.fqdn -o tsv)
          curl --fail --retry 12 --retry-delay 10 --retry-all-errors "https://$host/api/health"
